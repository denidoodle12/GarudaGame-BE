limit_req_zone $binary_remote_addr zone=threads_limit:10m rate=90r/m;

upstream forum_api {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name forum-api-denihidayat.duckdns.org;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  server_name forum-api-denihidayat.duckdns.org;

  ssl_certificate /etc/letsencrypt/live/forum-api-denihidayat.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/forum-api-denihidayat.duckdns.org/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  server_tokens off;
  client_max_body_size 1m;
  limit_req_status 429;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;

  location ~ ^/threads(?:/|$) {
    limit_req zone=threads_limit;
    proxy_pass http://forum_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://forum_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
